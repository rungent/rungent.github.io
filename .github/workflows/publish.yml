name: Publish

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Source commit SHA to build (empty = origin/main)
        required: false
        default: ''
  repository_dispatch:
    types: [publish-docs]

concurrency:
  group: publish-docs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: rungent/rungent
          ref: ${{ github.event.inputs.source_sha || github.event.client_payload.source_sha || 'main' }}
          path: src

      - name: Skip if already published
        id: skip
        run: |
          set -euo pipefail
          WANT=$(git -C src rev-parse HEAD)
          HAVE=""
          if [ -f site/.source-sha ]; then
            HAVE=$(cat site/.source-sha)
          fi
          echo "want=$WANT"
          echo "have=$HAVE"
          echo "sha=$WANT" >> "$GITHUB_OUTPUT"
          if [ "$WANT" = "$HAVE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.skip.outputs.changed == 'true'

      - uses: actions/setup-node@v4
        if: steps.skip.outputs.changed == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Build docs
        if: steps.skip.outputs.changed == 'true'
        working-directory: src
        env:
          NEXT_PUBLIC_SITE_URL: https://rungent.github.io
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @rungent/docs build

      - name: Commit published site
        if: steps.skip.outputs.changed == 'true'
        working-directory: site
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a ../src/apps/docs/out/ .
          echo "${{ steps.skip.outputs.sha }}" > .source-sha
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish docs from ${{ steps.skip.outputs.sha }}"
          git push
